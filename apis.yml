aid: laserdata
name: LaserData
description: 'LaserData is a hyper-efficient data streaming platform built in Rust for
  AI-native, real-time, and latency-sensitive workloads. Founded by the creators of Apache
  Iggy, LaserData packages the Iggy message-streaming engine — io_uring, thread-per-core,
  zero-copy deserialization, no garbage collection — as a managed cloud, BYOC, and on-premise
  product with sub-millisecond p99 latency and millions of messages per second per node.
  LaserData Cloud exposes a public REST control plane across three OpenAPI 3.1 services
  (Core, Audit, Notifier) covering tenants, divisions, environments, deployments, connectors,
  networking, API keys, roles and permissions, billing, notifications, and an immutable
  audit log, plus a per-deployment Supervisor API for configs, metrics, logs, diagnostic
  snapshots, and backups. The platform ships a first-party Rust SDK, a single-binary
  CLI with an interactive TUI, and an official Claude Code Agent Skill pack.'
