components:
  schemas:
    Paged_NotificationChannelInfo:
      type: object
      required:
      - total_pages
      - total_results
      - page
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - id
            - owner_kind
            - owner_id
            - channel
            - name
            - enabled
            - created_at
            - updated_at
            properties:
              channel:
                $ref: '#/components/schemas/NotificationChannelKind'
              created_at:
                type: string
                format: date-time
              enabled:
                type: boolean
              id:
                $ref: '#/components/schemas/NotificationChannelId'
              name:
                $ref: '#/components/schemas/NotificationChannelName'
              owner_id:
                type: integer
                format: int64
                example: 7261845022003200001
                minimum: 0
              owner_kind:
                $ref: '#/components/schemas/OwnerKind'
              updated_at:
                type: string
                format: date-time
            example:
              id: 7261845330120500000
              owner_kind: tenant
              owner_id: 7261845022003200001
              channel: email
              name: ops-team-email
              enabled: true
              created_at: '2026-05-20T10:00:00Z'
              updated_at: '2026-05-20T10:00:00Z'
        page:
          type: integer
          format: int64
          example: 1
          minimum: 1
        total_pages:
          type: integer
          format: int64
          example: 4
          minimum: 0
        total_results:
          type: integer
          format: int64
          example: 137
          minimum: 0
    NotificationChannelName:
      type: string
      example: ops-webhook
    NotificationChannelDestination:
      type: string
      example: https://hooks.slack.com/services/REDACTED
    DivisionId:
      type: integer
      format: int64
      example: 7261844974723780000
      minimum: 0
    OwnerKind:
      type: string
      enum:
      - user
      - tenant
      - division
      - system
    NotificationChannelId:
      type: integer
      format: int64
      example: 7261845612345670000
      minimum: 0
    UpdateChannel:
      type: object
      properties:
        destination:
          type:
          - string
          - 'null'
          example: https://hooks.example.com/laserdata/ops-v2
        enabled:
          type:
          - boolean
          - 'null'
        name:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NotificationChannelName'
        remarks:
          type:
          - string
          - 'null'
          example: Migrated to rotated webhook URL
        settings:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChannelSettings'
    WebhookSettings:
      type: object
      properties:
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        method:
          type:
          - string
          - 'null'
          example: POST
      example:
        headers:
          Authorization: Bearer secret-token
        method: POST
    NotificationChannelInfo:
      type: object
      required:
      - id
      - owner_kind
      - owner_id
      - channel
      - name
      - enabled
      - created_at
      - updated_at
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannelKind'
        created_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        id:
          $ref: '#/components/schemas/NotificationChannelId'
        name:
          $ref: '#/components/schemas/NotificationChannelName'
        owner_id:
          type: integer
          format: int64
          example: 7261845022003200001
          minimum: 0
        owner_kind:
          $ref: '#/components/schemas/OwnerKind'
        updated_at:
          type: string
          format: date-time
      example:
        id: 7261845330120500000
        owner_kind: tenant
        owner_id: 7261845022003200001
        channel: email
        name: ops-team-email
        enabled: true
        created_at: '2026-05-20T10:00:00Z'
        updated_at: '2026-05-20T10:00:00Z'
    ChannelSettings:
      type: object
      properties:
        slack:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SlackSettings'
        sms:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SmsSettings'
        webhook:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WebhookSettings'
    NotificationChannelKind:
      type: string
      enum:
      - slack
      - webhook
      - sms
      - email
    SlackSettings:
      type: object
      properties:
        channel:
          type:
          - string
          - 'null'
          example: laser-alerts
        icon_emoji:
          type:
          - string
          - 'null'
          example: ':rotating_light:'
        username:
          type:
          - string
          - 'null'
          example: LaserData Cloud
    TenantId:
      type: integer
      format: int64
      example: 7261845022003200001
      minimum: 0
    SmsSettings:
      type: object
      properties:
        sender_id:
          type:
          - string
          - 'null'
          example: LaserData
    NotificationChannelDetails:
      allOf:
      - $ref: '#/components/schemas/NotificationChannelInfo'
      - type: object
        required:
        - destination
        properties:
          destination:
            $ref: '#/components/schemas/NotificationChannelDestination'
          remarks:
            type:
            - string
            - 'null'
          settings:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ChannelSettings'
    CreateChannel:
      type: object
      required:
      - channel
      - name
      - destination
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannelKind'
        destination:
          type: string
          example: https://hooks.example.com/laserdata/ops
        name:
          $ref: '#/components/schemas/NotificationChannelName'
        remarks:
          type:
          - string
          - 'null'
          example: Primary production incident sink
        settings:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChannelSettings'
  securitySchemes:
    ld_api_key:
      type: apiKey
      in: header
      name: ld-api-key
      description: Tenant API key sent in the ld-api-key request header. Scoped to tenant-level audit reads. Cannot be used on user-scope endpoints (`/audit/users/activity`).
    session_cookie:
      type: apiKey
      in: cookie
      name: session
      description: Browser session cookie issued by POST /account/sign_in on core. Required for user-scope endpoints.
externalDocs:
  url: https://docs.laserdata.com
  description: LaserData Cloud documentation
