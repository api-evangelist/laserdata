envelope:
  fields:
  - name: type
    description: RFC 7807 type URI for the error class. about:blank when no type is registered.
  - name: title
    description: Short human-readable title derived from code (acronyms capitalised).
  - name: code
    description: Stable machine-readable error code, e.g. invalid_email, tenant_not_found, insufficient_permissions.
  - name: reason
    description: Long-form human explanation of this occurrence.
  - name: instance
    description: Mirrors the ld-request response header (simple-form UUID, 32 hex chars). Quote when filing
      support.
  - name: field
    description: Single field name when the error is bound to one field. Emitted for back-compat.
  - name: field_issues
    description: Array of per-field validation issues; each has code, reason and an optional dotted path.
  - name: status
    description: Mirror of the HTTP status code so agents can branch on the body.
  - name: retryable
    description: true for retryable conditions (408, 425, 429, 500, 502, 503, 504), false otherwise.
retryable_statuses:
- 408
- 425
- 429
- 500
- 502
- 503
- 504
